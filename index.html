// ─────────────────────────────────────────────
//  Team Roster — contracts + arb estimates
// ─────────────────────────────────────────────
const ARB_ESTIMATES = {
  "C":  { "S2":1500000,"Arb1":2800000,"Arb2":3500000,"Arb3":6500000,"Arb4":8500000 },
  "1B": { "S2":1700000,"Arb1":3200000,"Arb2":4000000,"Arb3":7500000,"Arb4":10000000 },
  "2B": { "S2":1600000,"Arb1":3000000,"Arb2":3800000,"Arb3":7000000,"Arb4":9000000 },
  "3B": { "S2":1800000,"Arb1":3400000,"Arb2":4200000,"Arb3":8000000,"Arb4":10500000 },
  "SS": { "S2":2000000,"Arb1":3800000,"Arb2":4800000,"Arb3":9000000,"Arb4":12000000 },
  "OF": { "S2":1800000,"Arb1":3300000,"Arb2":4200000,"Arb3":8000000,"Arb4":11000000 },
  "SP": { "S2":2000000,"Arb1":3800000,"Arb2":5000000,"Arb3":9500000,"Arb4":13000000 },
  "RP": { "S2":1600000,"Arb1":3000000,"Arb2":4000000,"Arb3":7500000,"Arb4":10000000 },
};
const PRE_ARB_SALARY = 750000;
const CURRENT_YEAR  = 2026;
const DISPLAY_YEARS = [2026,2027,2028,2029,2030,2031];
let CONTRACT_DATA   = {};
let _rosterData     = [];
let _rosterSortState = {};

function fmtSalary(n) {
  if (!n || n === 0) return "";
  if (n >= 1000000) return "$"+(n/1000000).toFixed(2)+"M";
  return "$"+(n/1000).toFixed(0)+"K";
}

function getPlayerSalary(player, year) {
  const name     = player.name;
  const contract = (player.contract||"").toString().trim();
  const cLower   = contract.toLowerCase();
  const salary   = player.salary||0;
  const pos      = (player.position||"OF").split(",")[0].trim();
  const posKey   = pos==="DH"?"1B":(ARB_ESTIMATES[pos]?pos:"OF");

  if (CONTRACT_DATA[name] && CONTRACT_DATA[name][year]) {
    // Extension: current year is guaranteed, future years are non-guaranteed (estimate=true)
    const isEstimate = year > CURRENT_YEAR;
    return { salary:CONTRACT_DATA[name][year], type:"ext", estimate:isEstimate };
  }
  if (cLower==="min0") return { salary:0, type:"minor", estimate:false };

  // Check team options FIRST — parseInt("3-TO") = 3 which would wrongly match plain number
  if (cLower.includes("-to")) {
    const toMatch = contract.match(/^(\d+)-to$/i);
    if (toMatch) {
      const toYears = parseInt(toMatch[1]); // total contract years
      const lastYear = CURRENT_YEAR + toYears - 1;
      if (year > lastYear) return { salary:0, type:"ufa", estimate:false };
      if (year === lastYear) return { salary, type:"to", estimate:false }; // option year = purple
      return { salary, type:"vet", estimate:false }; // prior years = blue vet
    }
  }

  // Plain number = years remaining on veteran contract
  const yearsLeft = parseInt(contract);
  if (!isNaN(yearsLeft) && String(yearsLeft) === contract.trim()) {
    const lastYear = CURRENT_YEAR+yearsLeft-1;
    if (year>lastYear) return { salary:0, type:"ufa", estimate:false };
    return { salary, type:"vet", estimate:false };
  }

  const minMatch = cLower.match(/^min(\d+)$/);
  if (minMatch) {
    // Min1 = currently in year 1 of 3 pre-arb years (2 more min years remaining after this)
    // Min2 = currently in year 2 of 3 pre-arb years (1 more min year remaining after this)
    // Min3 = currently in year 3 of 3 pre-arb years (0 more min years, next year = Arb1)
    const minYearNum = parseInt(minMatch[1]); // which min year they are in (1, 2, or 3)
    const remainingMinYears = 3 - minYearNum; // how many more min years after current
    const lastMinYear = CURRENT_YEAR + remainingMinYears;
    if (year > lastMinYear) {
      const arbYear = year - lastMinYear;
      if (arbYear <= 3) {
        return { salary:0, type:"arb", estimate:false, arbLabel:"Arb"+arbYear };
      }
      return { salary:0, type:"ufa", estimate:false };
    }
    return { salary:PRE_ARB_SALARY, type:"prearb", estimate:false };
  }

  const arbMatch = cLower.match(/^arb(\d+)$/);
  if (arbMatch) {
    const arbN = parseInt(arbMatch[1]);
    const futureArbN = arbN+(year-CURRENT_YEAR);
    if (futureArbN>4) return { salary:0, type:"ufa", estimate:false };
    // Current year: use actual salary from sheet; future years: just show label
    if (year === CURRENT_YEAR) return { salary, type:"arb", estimate:false, arbLabel:"Arb"+futureArbN };
    return { salary:0, type:"arb", estimate:false, arbLabel:"Arb"+futureArbN };
  }

  if (cLower==="tbd") return { salary:0, type:"ufa", estimate:false };
  if (cLower==="s2"||cLower.includes("super")) {
    return year===CURRENT_YEAR?{ salary, type:"arb", estimate:false, arbLabel:"S2" }:{ salary:0, type:"ufa", estimate:false };
  }
  if (cLower.startsWith("ext")) {
    return year===CURRENT_YEAR?{ salary, type:"ext", estimate:false }:{ salary:0, type:"ufa", estimate:false };
  }
  return { salary:0, type:"ufa", estimate:false };
}

function buildTeamRosterPage(teamName) {
  if (!_rosterData||!_rosterData.length) {
    return `<div class="status-bar" style="color:var(--text2)">Roster data not loaded yet.</div>`;
  }
  const teamPlayers = _rosterData.filter(p=>p.team===teamName);
  if (!teamPlayers.length) {
    return `<div class="status-bar" style="color:var(--text2)">No players found for ${teamName}.</div>`;
  }
  const active = teamPlayers.filter(p=>!["min0","Min0"].includes((p.contract||"").toString()));
  const minors = teamPlayers.filter(p=>["min0","Min0"].includes((p.contract||"").toString()));
  const deadPlayers = (DEAD_MONEY_DATA[teamName] || []);
  return `
    <div class="roster-notice">⚠ Arbitration figures (<strong>Arb1/2/3</strong>) are placeholders updated each January from Spotrac. <em>Italics</em> = non-guaranteed.</div>
    ${buildRosterTable(teamName, active, "Active Roster", deadPlayers)}
    ${minors.length?buildRosterTable(teamName, minors, "Minor League Roster", []):""}
  `;
}

function buildRosterTable(teamName, players, title, deadPlayers) {
  const safeTitle_key = title.replace(/\s+/g,"_");
  const sortKey = (_rosterSortState[safeTitle_key]||{}).col||"name";
  const sortDir = (_rosterSortState[safeTitle_key]||{}).dir||"asc";
  const isMinor = title.includes("Minor");
  const POS_ORDER = ["C","1B","2B","SS","3B","OF","UT","SP","RP"];

  const sorted = [...players].sort((a,b)=>{
    if (sortKey==="name") {
      const lastA = a.name.trim().split(" ").pop();
      const lastB = b.name.trim().split(" ").pop();
      return sortDir==="asc"?lastA.localeCompare(lastB):lastB.localeCompare(lastA);
    }
    if (sortKey==="pos") {
      const ai=POS_ORDER.indexOf((a.position||"").split(",")[0]);
      const bi=POS_ORDER.indexOf((b.position||"").split(",")[0]);
      return sortDir==="asc"?(ai<0?99:ai)-(bi<0?99:bi):(bi<0?99:bi)-(ai<0?99:ai);
    }
    const yr=parseInt(sortKey);
    if (!isNaN(yr)) {
      const av=getPlayerSalary(a,yr).salary||0;
      const bv=getPlayerSalary(b,yr).salary||0;
      return sortDir==="asc"?av-bv:bv-av;
    }
    return 0;
  });

  const safeTitle = title.replace(/\s+/g,"_");
  function th(col,lbl,style) {
    const s=sortKey===col?(sortDir==="desc"?"sorted-desc":"sorted-asc"):"";
    return `<th class="${s}" style="${style||"text-align:center"}" onclick="sortRosterTable(\'${teamName}\',\'${safeTitle}\',\'${col}\')">${lbl}</th>`;
  }

  function posBadge(pos) {
    if (!pos) return "";
    const p=pos.split(",")[0].trim();
    const cls=["C","1B","2B","3B","SS","OF","UT","SP","RP"].includes(p)?"pos-"+p:"";
    return `<span class="pos-badge ${cls}">${p}</span>`;
  }

  function firstUFAYear(p) {
    for (const yr of DISPLAY_YEARS) { if (getPlayerSalary(p,yr).type==="ufa") return yr; }
    return null;
  }

  const yearTotals={}, yearGuaranteed={};
  if (!isMinor) DISPLAY_YEARS.forEach(yr=>{
    let tot=0,gtd=0;
    sorted.forEach(p=>{
      const r=getPlayerSalary(p,yr);
      if (r.salary>0&&r.type!=="ufa"&&r.type!=="minor"){
        tot+=r.salary;
        if (!r.estimate) gtd+=r.salary;
      }
    });
    yearTotals[yr]=tot; yearGuaranteed[yr]=gtd;
  });

  const ctCls={prearb:"ct-prearb",arb:"ct-arb",vet:"ct-vet",ext:"ct-ext",to:"ct-to",ufa:"ct-ufa",minor:"ct-minor"};

  const rows = sorted.map(p=>{
    const ufy=firstUFAYear(p);
    const yearCells = isMinor?"":DISPLAY_YEARS.map(yr=>{
      const r=getPlayerSalary(p,yr);
      if (r.type==="minor") return `<td></td>`;
      if (r.type==="ufa") return yr===ufy?`<td><span class="ct-badge ct-ufa">UFA</span></td>`:`<td></td>`;
      // Arb years: show label (Arb1/Arb2/Arb3) with salary if current year
      if (r.type==="arb") {
        const lbl = r.arbLabel || "Arb";
        const salPart = r.salary>0 ? " "+fmtSalary(r.salary) : "";
        return `<td><span class="ct-badge ct-arb">${lbl}${salPart}</span></td>`;
      }
      // Pre-arb: current year guaranteed, future years non-guaranteed (italics)
      if (r.type==="prearb") {
        const sal = yr===CURRENT_YEAR ? fmtSalary(PRE_ARB_SALARY) : `<em>${fmtSalary(PRE_ARB_SALARY)}</em>`;
        return `<td><span class="ct-badge ct-prearb">${sal}</span></td>`;
      }
      // All others: show salary
      if (r.salary===0) return yr===ufy?`<td><span class="ct-badge ct-ufa">UFA</span></td>`:`<td></td>`;
      const sal = r.estimate?`<em>${fmtSalary(r.salary)}</em>`:fmtSalary(r.salary);
      return `<td><span class="ct-badge ${ctCls[r.type]||"ct-vet"}">${sal}</span></td>`;
    }).join("");
    return `<tr>
      <td><span class="roster-player-name">${p.name}</span></td>
      <td>${posBadge(p.position)}</td>
      ${yearCells}
    </tr>`;
  }).join("");

  // Add dead money to year totals
  const deadRows = (!isMinor && deadPlayers && deadPlayers.length) ? deadPlayers : [];
  deadRows.forEach(dp => {
    DISPLAY_YEARS.forEach(yr => {
      const hit = dp.yearHits[yr] || 0;
      if (hit > 0) {
        yearTotals[yr] = (yearTotals[yr] || 0) + hit;
        // Dead money is non-guaranteed
      }
    });
  });

  const totalRow = isMinor?"":DISPLAY_YEARS.map(yr=>{
    const diff=yearTotals[yr]-yearGuaranteed[yr];
    return `<td><strong>${fmtSalary(yearTotals[yr])}</strong>${diff>0?`<br><span style="font-size:9px;color:var(--text3);font-style:italic">${fmtSalary(yearGuaranteed[yr])} gtd</span>`:""}</td>`;
  }).join("");

  const legend=isMinor?"":
    `<div class="roster-legend">
      <span class="ct-badge ct-vet">Veteran</span>
      <span class="ct-badge ct-prearb">Pre-Arb</span>
      <span class="ct-badge ct-arb">Arbitration</span>
      <span class="ct-badge ct-ext">Extension</span>
      <span class="ct-badge ct-to">Team Option</span>
      <span class="ct-badge ct-ufa">UFA</span>
      <span style="font-size:11px;color:var(--text3);align-self:center"><em>Italics</em> = non-guaranteed</span>
    </div>`;

  const yearHeaders=isMinor?"":DISPLAY_YEARS.map(yr=>th(yr.toString(),yr.toString())).join("");
  const tableClass=isMinor?"roster-table minor-table":"roster-table";

  // Dead money rows — always at bottom, italicized, not sortable
  let deadRowsHtml = "";
  if (!isMinor && deadRows.length) {
    deadRowsHtml = deadRows.map(dp => {
      const yearCells = DISPLAY_YEARS.map(yr => {
        const hit = dp.yearHits[yr] || 0;
        if (!hit) return `<td></td>`;
        return `<td><span class="ct-badge ct-prearb" style="background:#6B728033"><em>${fmtSalary(hit)}</em></span></td>`;
      }).join("");
      return `<tr style="opacity:0.75">
        <td><span class="roster-player-name" style="font-style:italic;color:var(--text2)">${dp.name}</span></td>
        <td><span class="pos-badge" style="background:var(--bg3);color:var(--text3)">DM</span></td>
        ${yearCells}
      </tr>`;
    }).join("");
  }

  const deadLabel = !isMinor && deadRows.length
    ? `<div style="font-size:11px;color:var(--text3);margin-bottom:4px;padding-left:2px">
        <em>Dead money players shown in gray italics — included in team totals</em>
      </div>` : "";

  return `<div class="roster-wrap">
    <div class="roster-section-title">${title} (${sorted.length} players${deadRows.length?" + "+deadRows.length+" dead money":""})</div>
    ${legend}
    ${deadLabel}
    <div class="roster-table-wrap">
      <table class="${tableClass}">
        <thead><tr>${th("name","Player","text-align:left")}${th("pos","Pos")}${yearHeaders}</tr></thead>
        <tbody>${rows}${deadRowsHtml}</tbody>
        ${!isMinor?`<tfoot><tr class="roster-totals-row"><td><strong>Total Payroll</strong></td><td></td>${totalRow}</tr></tfoot>`:""}
      </table>
    </div>
  </div>`;
}

function sortRosterTable(teamName, tableTitle, col) {
  const cur = _rosterSortState[tableTitle]||{col:"name",dir:"asc"};
  _rosterSortState[tableTitle] = {
    col,
    dir: cur.col===col ? (cur.dir==="asc"?"desc":"asc") : (col==="name"||col==="pos"?"asc":"desc")
  };
  // Re-render the roster page keeping current team
  const el = document.getElementById("roster-content");
  if (el) el.innerHTML = buildTeamRosterPage(teamName);
}


// ─────────────────────────────────────────────
//  Parse Player Salary tab for roster
// ─────────────────────────────────────────────
function parseRosterData(rows) {
  const players = [];
  if (rows.length < 2) return players;
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0] || !r[0].trim()) continue;
    players.push({
      name:     r[0].trim(),
      salary:   parseMoney(r[1]),
      team:     r[2] ? r[2].trim() : "",
      contract: r[3] ? r[3].trim() : "",
      position: r[4] ? r[4].trim() : "",
    });
  }
  return players;
}

// ─────────────────────────────────────────────
//  Parse Contract Extensions tab
// ─────────────────────────────────────────────
function parseContractExtensions(rows) {
  const data = {};
  if (rows.length < 2) return data;
  const headers = rows[0].map(h => h.trim());
  const yearCols = {};
  headers.forEach((h, i) => {
    const yr = parseInt(h);
    if (yr >= 2025 && yr <= 2035) yearCols[yr] = i;
  });
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const name = r[0] ? r[0].trim() : "";
    if (!name) continue;
    data[name] = { contract: r[2] ? r[2].trim() : "Ext" };
    Object.entries(yearCols).forEach(([yr, col]) => {
      const val = r[col] ? parseMoney(r[col]) : 0;
      if (val > 0) data[name][parseInt(yr)] = val;
    });
  }
  return data;
}


// ─────────────────────────────────────────────
//  Dead Money
// ─────────────────────────────────────────────
let DEAD_MONEY_DATA = {}; // team -> [{ name, yearHits: {2026:x, 2027:x, ...} }]

function parseDeadMoney(rows) {
  const data = {};
  if (rows.length < 2) return data;
  // Columns: Player, Salary, Yrs Remain, Pre New League Year, Team, 2026 Cap Hit, Future Cap Hit Total, Year Expiring
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0] || !r[0].trim()) continue;
    const name        = r[0].trim();
    const team        = r[4] ? r[4].trim() : "";
    const hit2026     = parseMoney(r[5]);   // current year cap hit (already adjusted)
    const futureTotal = parseMoney(r[6]);   // total future dead money
    const yrsRemain   = parseInt(r[2]) || 1;
    const yearExpiring = parseInt(r[7]) || CURRENT_YEAR;

    // Build year-by-year hits
    // 2026 = hit2026 (from sheet)
    // Future years: spread futureTotal evenly across remaining years (yearExpiring - 2026)
    const yearHits = {};
    yearHits[CURRENT_YEAR] = hit2026;

    const futureYears = yearExpiring - CURRENT_YEAR;
    if (futureYears > 0 && futureTotal > 0) {
      const perYear = futureTotal / futureYears;
      for (let yr = CURRENT_YEAR + 1; yr <= yearExpiring; yr++) {
        yearHits[yr] = perYear;
      }
    }

    if (!data[team]) data[team] = [];
    data[team].push({ name, yearHits });
  }
  return data;
}


// ─────────────────────────────────────────────
//  Main load
// ─────────────────────────────────────────────
async function loadData() {
  const statusEl = document.getElementById("status");
  const dashEl   = document.getElementById("dashboard");
  statusEl.className = "status-bar";
  statusEl.innerHTML = '<span class="spinner"></span> Loading live data from Google Sheets…';
  statusEl.style.display = "block";
  dashEl.style.display = "none";

  try {
    const finCSV  = await fetchCSV(FINANCE_CSV);
    const teams   = parseFinance(parseCSV(finCSV));
    _teams = teams;

    try {
      const histCSV = await fetchCSV(HISTORY_CSV);
      HISTORY_FALLBACK = parseHistory(parseCSV(histCSV));
    } catch(e) { console.warn("History tab failed", e); }

    try {
      const playerCSV = await fetchCSV(PLAYER_SALARY_CSV);
      UPCOMING_FA_LIVE = parsePlayerSalary(parseCSV(playerCSV));
      _rosterData = parseRosterData(parseCSV(playerCSV));
    } catch(e) { console.warn("Player salary tab failed", e); }

    try {
      const contractCSV = await fetchCSV(CONTRACTS_CSV);
      CONTRACT_DATA = parseContractExtensions(parseCSV(contractCSV));
    } catch(e) { console.warn("Contract extensions failed", e); }

    try {
      const deadCSV = await fetchCSV(DEAD_MONEY_CSV);
      DEAD_MONEY_DATA = parseDeadMoney(parseCSV(deadCSV));
    } catch(e) { console.warn("Dead money tab failed", e); }

    try {
      const rulesCSV = await fetchCSV(RULES_CSV);
      RULES_DATA.proposed = parseRulesChanges(parseCSV(rulesCSV));
    } catch(e) { console.warn("Rules changes tab failed", e); }

    try {
      const formCSV = await fetchCSV(FORM_RESP_CSV);
      FORM_RESP_DATA = parseFormResponses(parseCSV(formCSV));
    } catch(e) { console.warn("Form responses tab failed", e); }

    const payouts = parsePayouts(parseCSV(finCSV));
    window._payouts = payouts;

    document.getElementById("home-content").innerHTML       = buildLeagueHome(teams, payouts);
    document.getElementById("financials-content").innerHTML = buildFinancialsHome();
    document.getElementById("fa-content").innerHTML         = buildFASectionInner(teams);
    document.getElementById("rules-content").innerHTML      = buildRulesSectionInner();
    document.getElementById("cba-content").innerHTML        = buildCBAInner();

    buildFinancialsSubmenu(teams);
    buildRosterSubmenu(teams);

    statusEl.style.display = "none";
    dashEl.style.display   = "block";
    showSection("home");

    const now = new Date();
    document.getElementById("last-updated").textContent =
      "Updated " + now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});

  } catch (err) {
    statusEl.className = "status-bar error";
    statusEl.innerHTML = "⚠ Could not load data from Google Sheets. Make sure the sheet is published as CSV.<br><small>" + err.message + "</small><br><br><button onclick=\"loadData()\" style=\"margin-top:8px;padding:6px 16px;cursor:pointer;border-radius:6px;border:1px solid #ccc\">↻ Retry</button>";
  }
}

loadData();

</script>
