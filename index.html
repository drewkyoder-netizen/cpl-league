<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>California Penal League — Dashboard</title>
<style>
  /* ── Reset & base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f4f4f1; --bg3: #eeede9;
    --text: #1a1a18; --text2: #5f5e5a; --text3: #888780;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --good: #3b6d11; --warn: #ba7517; --danger: #a32d2d;
    --radius: 8px; --radius-lg: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2e2e2b;
      --text: #f0efe9; --text2: #b4b2a9; --text3: #888780;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --good: #7ab83e; --warn: #e8a030; --danger: #e05555;
    }
  }
  body { font-family: var(--font); background: var(--bg3); color: var(--text); min-height: 100vh; margin: 0; }

  /* ── App Layout ── */
  .app-layout { display: flex; min-height: 100vh; }

  /* ── Sidebar ── */
  .sidebar { width: 220px; flex-shrink: 0; background: var(--bg); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 200; overflow-y: auto; transition: transform .25s ease; }
  .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 1.25rem 1rem 1rem; border-bottom: 0.5px solid var(--border); }
  .sidebar-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .sidebar-season { font-size: 11px; color: var(--text3); }
  .sidebar-nav { flex: 1; padding: .5rem 0; }
  .sidebar-footer { padding: .75rem 1rem; border-top: 0.5px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .nav-item { width: 100%; background: none; border: none; cursor: pointer; padding: 9px 1rem; display: flex; align-items: center; gap: 9px; font-family: var(--font); font-size: 13px; color: var(--text2); text-align: left; transition: background .12s, color .12s; border-radius: 0; }
  .nav-item:hover { background: var(--bg2); color: var(--text); }
  .nav-item.active { background: var(--bg2); color: var(--text); font-weight: 500; border-left: 3px solid #378ADD; }
  .nav-item.sub-item { padding-left: 2.5rem; font-size: 12px; }
  .nav-item.sub-item.active { border-left: 3px solid #378ADD; }
  .nav-icon { font-size: 14px; flex-shrink: 0; }
  .nav-arrow { margin-left: auto; font-size: 10px; transition: transform .2s; color: var(--text3); }
  .nav-arrow.open { transform: rotate(90deg); }
  .nav-submenu { display: none; background: var(--bg2); }
  .nav-submenu.open { display: block; }

  /* ── Hamburger (mobile only) ── */
  .hamburger { display: none; position: fixed; top: 12px; left: 12px; z-index: 300; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; font-size: 18px; line-height: 1; }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 150; }

  /* ── Main content ── */
  .main-content { margin-left: 220px; flex: 1; padding: 1.5rem 1.5rem 2rem; min-width: 0; }
  .page-section { display: block; }
  .page-section.hidden { display: none; }
  .page-header { margin-bottom: 1.25rem; padding-bottom: .75rem; border-bottom: 0.5px solid var(--border); }
  .page-title { font-size: 18px; font-weight: 500; color: var(--text); }

  .refresh-btn { background: none; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--text2); font-family: var(--font); }
  .refresh-btn:hover { background: var(--bg2); }
  .last-updated { font-size: 11px; color: var(--text3); }

  /* ── Mobile breakpoint ── */
  @media (max-width: 700px) {
    .hamburger { display: block; }
    .sidebar { transform: translateX(-100%); }
    .sidebar.mobile-open { transform: translateX(0); }
    .sidebar-overlay.visible { display: block; }
    .main-content { margin-left: 0; padding: 3.5rem 1rem 2rem; }
    .top-row { grid-template-columns: 1fr !important; }
    .teams-grid { grid-template-columns: 1fr !important; }
    .p-grid { grid-template-columns: 1fr 1fr !important; }
    .hist-grid { grid-template-columns: 1fr 1fr !important; }
    .fin-rankings-grid { grid-template-columns: 1fr !important; }
    .fa-filters { gap: 5px; }
    .fa-filter-btn { padding: 3px 8px; font-size: 11px; }
    .page-title { font-size: 15px; }
    .sidebar-logo { padding: 1rem; }
  }

  /* ── Loading / error ── */
  .status-bar { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 2rem; text-align: center; color: var(--text2); font-size: 14px; margin-bottom: 1.5rem; }
  .status-bar.error { border-color: var(--danger); color: var(--danger); }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--text2); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Summary panels ── */
  .top-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,2fr) minmax(0,1.4fr); gap: 12px; margin-bottom: 1.5rem; }
  @media (max-width: 700px) { .top-row { grid-template-columns: 1fr; } }
  .panel-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.1rem; }
  .panel-title { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; margin-bottom: .75rem; }
  .pot-total { font-size: 26px; font-weight: 500; color: var(--text); margin-bottom: .75rem; }
  .pot-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-top: 0.5px solid var(--border); font-size: 12px; }
  .pot-label { color: var(--text2); }
  .pot-val { font-weight: 500; color: var(--text); }
  .list-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-top: 0.5px solid var(--border); font-size: 12px; gap: 6px; }
  .list-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .list-name { color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-val { font-weight: 500; white-space: nowrap; }
  .list-val.red { color: var(--danger); }
  .bar-wrap { width: 48px; flex-shrink: 0; }
  .bar-bg { height: 5px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }

  /* ── Team grid ── */
  .sec-lbl { font-size: 12px; font-weight: 500; color: var(--text2); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; }
  .teams-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(295px, 1fr)); gap: 11px; margin-bottom: 1.5rem; }
  .tc { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; cursor: pointer; transition: border-color .15s; }
  .tc:hover { border-color: var(--border2); }
  .tc.active { border: 2px solid #378ADD; }
  .th { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-bottom: 0.5px solid var(--border); }
  .tlogo { flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 500; letter-spacing: .5px; line-height: 1.1; text-align: center; font-size: 10px; }
  .tname { font-size: 13px; font-weight: 500; color: var(--text); }
  .towner { font-size: 11px; color: var(--text2); }
  .tphone { font-size: 11px; color: var(--text3); }
  .tsub { font-size: 11px; color: var(--text2); }
  .tbar-wrap { padding: 8px 13px 5px; }
  .tbar-lbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--text2); margin-bottom: 3px; }
  .tbar-bg { height: 7px; background: var(--bg2); border-radius: 4px; overflow: hidden; }
  .tbar-fill { height: 100%; border-radius: 4px; }
  .tstats { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; padding: 8px 13px 10px; gap: 4px; }
  .s-lbl { font-size: 10px; color: var(--text2); margin-bottom: 2px; }
  .s-val { font-size: 12px; font-weight: 500; color: var(--text); }
  .s-val.red { color: var(--danger); } .s-val.warn { color: var(--warn); }

  /* ── Detail panel ── */
  .detail-panel { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; display: none; }
  .detail-panel.visible { display: block; }
  .p-top { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
  .p-name { font-size: 17px; font-weight: 500; color: var(--text); }
  .p-sub { font-size: 12px; color: var(--text2); }
  .p-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 9px; margin-bottom: 1rem; }
  .hist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 9px; margin-bottom: .75rem; }
  .pm { background: var(--bg2); border-radius: var(--radius); padding: .7rem .85rem; }
  .pm-lbl { font-size: 10px; color: var(--text2); margin-bottom: 3px; }
  .pm-val { font-size: 16px; font-weight: 500; color: var(--text); }
  .pm-val.red { color: var(--danger); } .pm-val.warn { color: var(--warn); } .pm-val.good { color: var(--good); }
  .pm-sub { font-size: 10px; color: var(--text2); margin-top: 2px; }
  .pm-sub.good { color: var(--good); } .pm-sub.red { color: var(--danger); }
  .pbar-bg { height: 10px; background: var(--bg2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .pbar-fill { height: 100%; border-radius: 4px; }
  .pbar-lbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--text2); margin-bottom: 3px; }
  .close-btn { margin-left: auto; background: none; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--text2); font-family: var(--font); }
  .close-btn:hover { background: var(--bg2); }
  .divider { border: none; border-top: 0.5px solid var(--border); margin: .75rem 0; }
  .sec-header { font-size: 11px; font-weight: 500; color: var(--text2); margin-bottom: 6px; margin-top: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  .net-dues-box { background: var(--bg2); border-radius: var(--radius); padding: .85rem; }
  .net-dues-box .pm-lbl { font-size: 11px; }
  .net-dues-box .pm-val { font-size: 26px; }



  /* ── Upcoming Free Agents ── */
  .fa-wrap { margin-top: 2rem; margin-bottom: 1rem; }
  .fa-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 8px; }
  .fa-header h2 { font-size: 14px; font-weight: 500; color: var(--text2); letter-spacing: .05em; text-transform: uppercase; }
  .fa-meta { font-size: 11px; color: var(--text3); }
  .fa-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .fa-filter-btn { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--text2); font-family: var(--font); transition: all .15s; }
  .fa-filter-btn:hover { background: var(--bg2); }
  .fa-filter-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .fa-table-wrap { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .fa-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .fa-table th { padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .04em; border-bottom: 0.5px solid var(--border); background: var(--bg2); }
  .fa-table td { padding: 8px 12px; border-bottom: 0.5px solid var(--border); color: var(--text); }
  .fa-table tr:last-child td { border-bottom: none; }
  .fa-table tr:hover td { background: var(--bg2); }
  .fa-pos-badge { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 4px; background: var(--bg3); color: var(--text2); min-width: 28px; text-align: center; }
  .fa-to-note { font-size: 10px; color: var(--warn); margin-left: 3px; font-style: italic; }
  .fa-contract-tag { font-size: 11px; color: var(--text3); }
  .fa-team-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex-shrink: 0; }
  .fa-group-row td { background: var(--bg2); font-size: 11px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; padding: 5px 12px; border-bottom: 0.5px solid var(--border); }
  .fa-footnote { font-size: 11px; color: var(--text3); margin-top: 6px; }

  /* ── FA Sort buttons ── */
  .fa-team-filter { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 3px; cursor: pointer; transition: outline .15s; }
  .fa-team-filter:hover { background: var(--bg2); }
  .fa-team-filter.active { outline: 2px solid #378ADD; }
  .fa-sort-btn { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--text2); font-family: var(--font); white-space: nowrap; }
  .fa-sort-btn:hover { background: var(--bg2); }
  .fa-sort-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* ── League Home historical table ── */
  .hist-table-wrap { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow-x: auto; margin-bottom: 1.5rem; }
  .hist-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  .hist-table th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .04em; background: var(--bg2); border-bottom: 0.5px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
  .hist-table th:hover { color: var(--text); }
  .hist-table th.sorted-asc::after { content: " ▲"; font-size: 9px; }
  .hist-table th.sorted-desc::after { content: " ▼"; font-size: 9px; }
  .hist-table td { padding: 9px 12px; border-bottom: 0.5px solid var(--border); color: var(--text); vertical-align: middle; }
  .hist-table tr:last-child td { border-bottom: none; }
  .hist-table tr:hover td { background: var(--bg2); }
  .hist-team-cell { display: flex; align-items: center; gap: 9px; }
  .hist-team-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .money-pos { color: var(--good); font-weight: 500; }
  .money-neg { color: var(--danger); font-weight: 500; }
  .champ-star { color: #BA7517; }
  .home-payout-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 0.5px solid var(--border); font-size: 13px; }

  /* ── Team Financials ranking tables ── */
  .fin-ranking { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1rem; }
  .fin-ranking-title { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; padding: .6rem 1rem; background: var(--bg2); border-bottom: 0.5px solid var(--border); }
  .fin-rank-row { display: flex; align-items: center; gap: 10px; padding: 7px 1rem; border-top: 0.5px solid var(--border); font-size: 13px; }
  .fin-rank-row:first-of-type { border-top: none; }
  .fin-rank-num { font-size: 11px; color: var(--text3); width: 18px; flex-shrink: 0; text-align: right; }
  .fin-rank-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .fin-rank-name { flex: 1; color: var(--text); }
  .fin-rank-val { font-weight: 500; white-space: nowrap; }
  .fin-rank-bar-wrap { width: 80px; flex-shrink: 0; }
  .fin-rank-bar-bg { height: 5px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
  .fin-rank-bar-fill { height: 100%; border-radius: 3px; }
  .fin-rankings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }

  /* ── League Home pot boxes ── */
  .pot-boxes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .pot-box { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: .85rem 1rem; }
  .pot-box-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .pot-box-val { font-size: 20px; font-weight: 500; color: var(--good); }
  .pot-box-total { background: var(--bg); border: 2px solid var(--good); border-radius: var(--radius-lg); padding: .85rem 1rem; }
  .pot-box-total .pot-box-label { color: var(--good); font-weight: 500; }
  .pot-box-total .pot-box-val { font-size: 26px; color: var(--good); }

  /* ── Team Financials combined table ── */
  .fin-table-wrap { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow-x: auto; margin-bottom: 1.5rem; }
  .fin-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  .fin-table th { padding: 9px 12px; text-align: right; font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .04em; background: var(--bg2); border-bottom: 0.5px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
  .fin-table th:first-child { text-align: left; }
  .fin-table th:hover { color: var(--text); }
  .fin-table th.sorted-asc::after { content: " ▲"; font-size: 9px; }
  .fin-table th.sorted-desc::after { content: " ▼"; font-size: 9px; }
  .fin-table td { padding: 9px 12px; border-bottom: 0.5px solid var(--border); text-align: right; vertical-align: middle; }
  .fin-table td:first-child { text-align: left; }
  .fin-table tr:last-child td { border-bottom: none; }
  .fin-table tr:hover td { background: var(--bg2); cursor: pointer; }
  .fin-team-cell { display: flex; align-items: center; gap: 9px; }
  .fin-val-pos { color: var(--good); font-weight: 500; }
  .fin-val-neg { color: var(--danger); font-weight: 500; }
  .fin-val-warn { color: var(--warn); font-weight: 500; }

  /* ── Team Roster Page ── */
  .roster-notice { font-size: 11px; color: var(--text3); background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 6px 10px; margin-bottom: 1rem; }
  .roster-wrap { margin-bottom: 2rem; }
  .roster-section-title { font-size: 13px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .5rem; padding-bottom: .5rem; border-bottom: 0.5px solid var(--border); }
  .roster-legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: .75rem; }
  .roster-table-wrap { overflow-x: auto; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 1.5rem; }
  .roster-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 600px; }
  .roster-table th { padding: 8px 10px; text-align: center; font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .04em; background: var(--bg2); border-bottom: 0.5px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  .roster-table th:first-child { text-align: left; }
  .roster-table th:hover { color: var(--text); }
  .roster-table th.sorted-asc::after { content: " ▲"; font-size: 9px; }
  .roster-table th.sorted-desc::after { content: " ▼"; font-size: 9px; }
  .roster-table td { padding: 6px 10px; border-bottom: 0.5px solid var(--border); color: var(--text); vertical-align: middle; white-space: nowrap; text-align: center; }
  .roster-table td:first-child { text-align: left; }
  .roster-table tr:last-child td { border-bottom: none; }
  .roster-table tr:hover td { background: var(--bg2); }
  .roster-player-name { font-weight: 500; color: var(--text); }
  /* Contract pill colors — salary shown inside pill */
  .ct-badge { display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 4px; text-align: center; min-width: 70px; gap: 4px; }
  .ct-prearb  { background: #DC2626; color: #fff; }
  .ct-arb     { background: #D97706; color: #fff; }
  .ct-arb-est { background: #D97706; color: #fff; opacity: 0.85; }
  .ct-vet     { background: #2563EB; color: #fff; }
  .ct-ext     { background: #059669; color: #fff; }
  .ct-to      { background: #7C3AED; color: #fff; }
  .ct-ufa     { background: #6B7280; color: #fff; }
  .ct-minor   { background: #16A34A; color: #fff; }
  .ct-blank   { color: var(--text3); font-size: 11px; }
  .ct-est-italic { font-style: italic; }
  .roster-year-col { text-align: center; }
  .roster-totals-row td { background: var(--bg2); font-weight: 500; border-top: 1px solid var(--border2); text-align: center; }
  .roster-totals-row td:first-child { text-align: left; }
  /* Position badge colors matching FA page */
  .pos-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }

// ─────────────────────────────────────────────
//  Fetch CSV via multiple strategies
//  Tries each in sequence until one returns valid CSV
// ─────────────────────────────────────────────
async function fetchCSV(url) {
  const TIMEOUT_MS = 6000;
  const proxies = [
    url,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  ];

  for (const proxyUrl of proxies) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
      const resp = await fetch(proxyUrl, { signal: controller.signal });
      clearTimeout(timer);
      if (resp && resp.ok) {
        const text = await resp.text();
        if (text && text.length > 100 && !text.trim().startsWith("<")) {
          console.log("fetchCSV success via:", proxyUrl.substring(0,60));
          return text;
        }
      }
    } catch(e) {
      console.warn("fetchCSV proxy failed:", proxyUrl.substring(0,60), e.message);
    }
  }
  throw new Error("All proxies failed. Check Google Sheet is published as CSV.");
}

// ─────────────────────────────────────────────
//  Parse League History CSV
//  Columns: Team Name, Money+/-, Win%, Avg Finish,
//           Total Wins, Total Losses, Avg Season Pts,
//           Playoff Appearances, Championships
// ─────────────────────────────────────────────
function parseHistory(rows) {
  const hist = {};
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0] || !r[0].trim()) continue;
    const name = r[0].trim();
    hist[name] = {
      moneyPL:     parseMoney(r[1]),
      winPct:      parseFloat(r[2]) || 0,
      avgFinish:   parseFloat(r[3]) || 0,
      wins:        parseInt(r[4])   || 0,
      losses:      parseInt(r[5])   || 0,
      avgPts:      parseFloat(r[6]) || 0,
      playoffApps: parseInt(r[7])   || 0,
      champs:      parseInt(r[8])   || 0,
    };
  }
  return hist;
}
let HISTORY_FALLBACK = {};

// ─────────────────────────────────────────────
//  CSV parser
// ─────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    const cols = [];
    let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ""; }
      else { cur += c; }
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

function parseMoney(s) {
  if (!s) return 0;
  s = s.trim();
  // Google Sheets accounting format: "$ (223.90)" = negative, "$ 6,080.56" = positive
  const isNeg = s.includes("(") || s.startsWith("-");
  const clean = parseFloat(s.replace(/[$,()\-\s]/g, "")) || 0;
  return isNeg ? -clean : clean;
}

// ─────────────────────────────────────────────
//  Parse payouts from rows 57-65 (0-indexed: 56-64)
//  Row 58 = header, 59=RS 1st, 60=RS 2nd,
//  61 = header, 62=PO 1st, 63=PO 2nd, 64=PO 3rd, 65=Toilet Bowl
// ─────────────────────────────────────────────
function parsePayouts(rows) {
  // rows are 0-indexed so row 59 = index 58, etc.
  const get = (rowIdx) => {
    const r = rows[rowIdx];
    if (!r) return { label: "", amount: 0 };
    // label in col 0, value in col 1
    return { label: r[0] ? r[0].trim() : "", amount: parseMoney(r[1]) };
  };
  return [
    { label: "Reg. season 1st",  amount: get(58).amount },
    { label: "Reg. season 2nd",  amount: get(59).amount },
    { label: "Playoff 1st",      amount: get(61).amount },
    { label: "Playoff 2nd",      amount: get(62).amount },
    { label: "Playoff 3rd",      amount: get(63).amount },
    { label: "Toilet bowl",      amount: get(64).amount },
  ];
}

// ─────────────────────────────────────────────
//  Parse the 2026 Financial Overview CSV
//  Sheet layout: teams in columns, two blocks
//  Block 1: rows 1-23  → KC, SEA, LAD, LAA, TEX, MIL
//  Block 2: rows 25-47 → LV, CHC, SD, BAL, SF, CIN
// ─────────────────────────────────────────────
function parseFinance(rows) {
  const teams = {};

  function extractBlock(nameRow, startRow) {
    // nameRow is 0-indexed
    const names = [];
    for (let c = 1; c < rows[nameRow].length; c += 2) {
      const n = rows[nameRow][c];
      if (n && n.trim()) names.push({ name: n.trim(), col: c });
    }
    names.forEach(({ name, col }) => {
      const r = startRow; // offset to use for row lookup
      const get = (rowIdx, colOffset=0) => rows[rowIdx] ? (rows[rowIdx][col + colOffset] || "0") : "0";
      teams[name] = {
        name,
        payrollReal:      parseMoney(get(r+15)),
        payrollDues:      parseMoney(get(r+15, 1)),
        taxReal:          parseMoney(get(r+16)),
        taxDues:          parseMoney(get(r+16, 1)),
        deadReal:         parseMoney(get(r+17)),
        deadDues:         parseMoney(get(r+17, 1)),
        tradeSpentReal:   parseMoney(get(r+18)),
        tradeSpentDues:   parseMoney(get(r+18, 1)),
        mlBonusReal:      parseMoney(get(r+20)),
        mlBonusDues:      parseMoney(get(r+20, 1)),
        totalExpDues:     parseMoney(get(r+21, 1)),
        tradeSavedReal:   parseMoney(get(r+10)),
        tradeSavedDues:   parseMoney(get(r+10, 1)),
        totalEarnDues:    parseMoney(get(r+12, 1)),
        finalDues:        parseMoney(get(r+22, 1)),
        guaranteed2027:   parseMoney(get(r+2)),
        expiring:         parseMoney(get(r+3)),
        nonGuaranteed:    parseMoney(get(r+4)),
        futDead:          parseMoney(get(r+5)),
        regSeasonFinish:  get(r+8).trim(),
        regSeasonDues:    parseMoney(get(r+8, 1)),
        playoffFinish:    get(r+9).trim(),
        playoffDues:      parseMoney(get(r+9, 1)),
      };
    });
  }

  extractBlock(0, 0);   // Block 1: rows 1-23 (0-indexed: 0-22)
  extractBlock(24, 24); // Block 2: rows 25-47 (0-indexed: 24-46)
  return teams;
}

// ─────────────────────────────────────────────
//  Build summary panels
// ─────────────────────────────────────────────
function buildSummary(teams, payouts) {
  const teamArr = Object.values(teams);
  const sortedPayroll = [...teamArr].sort((a,b) => (b.payrollReal+b.deadReal) - (a.payrollReal+a.deadReal));
  const sortedDues    = [...teamArr].sort((a,b) => b.finalDues - a.finalDues);

  const payrollRows = sortedPayroll.map(t => {
    const meta  = TEAM_META[t.name] || { color1:"#888", abbr:"?" };
    const total = t.payrollReal + t.deadReal;
    const pct   = Math.min(104, Math.round(total/CAP*100));
    const space = CAP - total;
    const spaceStr = space >= 0 ? fmtM(space)+" left" : fmtM(Math.abs(space))+" over";
    const spaceColor = space >= 0 ? "var(--text2)" : "var(--danger)";
    return `<div class="list-row">
      <div class="list-dot" style="background:${meta.color1}"></div>
      <span class="list-name">${t.name.replace("Los Angeles","LA")}</span>
      <div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,pct)}%;background:${barColor(pct)}"></div></div></div>
      <span class="list-val" style="color:${spaceColor};font-size:11px;min-width:52px;text-align:right">${spaceStr}</span>
      <span class="list-val" style="min-width:54px;text-align:right">${fmtM(total)}</span>
    </div>`;
  }).join("");

  const duesRows = sortedDues.map(t => {
    const meta = TEAM_META[t.name] || { color1:"#888" };
    return `<div class="list-row">
      <div class="list-dot" style="background:${meta.color1}"></div>
      <span class="list-name">${t.name.replace("Los Angeles","LA")}</span>
      <span class="list-val" style="color:${t.finalDues>=0?'var(--good)':'var(--danger)'}">${t.finalDues>=0?'+ '+fmtD(t.finalDues):'-'+fmtD(t.finalDues)}</span>
    </div>`;
  }).join("");

  const totalPot = payouts.reduce((s,p)=>s+p.amount,0);
  // Sort payouts: playoffs first then regular season then toilet bowl
  const payoutOrder = ["Playoff 1st","Playoff 2nd","Playoff 3rd","Reg. season 1st","Reg. season 2nd","Toilet bowl"];
  const sortedPayouts = [...payouts].sort((a,b)=>payoutOrder.indexOf(a.label)-payoutOrder.indexOf(b.label));

  return `<div class="top-row">
    <div class="panel-card">
      <div class="panel-title">Total pot</div>
      <div class="pot-total">${fmtD(totalPot)}</div>
      ${sortedPayouts.map(p=>`<div class="pot-row"><span class="pot-label">${p.label}</span><span class="pot-val">${fmtD(p.amount)}</span></div>`).join("")}
    </div>
    <div class="panel-card">
      <div class="panel-title">Team payrolls (active + dead money) · $250M cap</div>
      ${payrollRows}
    </div>
    <div class="panel-card">
      <div class="panel-title">Net dues owed / earned</div>
      ${duesRows}
    </div>
  </div>`;
}

// ─────────────────────────────────────────────
//  League Home — pot + sortable history table
// ─────────────────────────────────────────────
let histSortCol = "moneyPL";
let histSortDir = "desc";

function buildLeagueHome(teams, payouts) {
  const totalPot = payouts.reduce((s,p)=>s+p.amount,0);
  const fmtMoney = v => "$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

  // Sort payouts in specific order
  const PAYOUT_ORDER = ["Reg. season 1st","Reg. season 2nd","Playoff 1st","Playoff 2nd","Playoff 3rd","Toilet bowl"];
  const sortedPayouts = [...payouts].sort((a,b) => {
    const ai = PAYOUT_ORDER.findIndex(l => a.label.toLowerCase().includes(l.toLowerCase().substring(0,8)));
    const bi = PAYOUT_ORDER.findIndex(l => b.label.toLowerCase().includes(l.toLowerCase().substring(0,8)));
    return (ai===-1?99:ai)-(bi===-1?99:bi);
  });

  const boxes = sortedPayouts.map(p =>
    `<div class="pot-box"><div class="pot-box-label">${p.label}</div><div class="pot-box-val">${fmtMoney(p.amount)}</div></div>`
  ).join("");

  const potPanel = `
    <div class="pot-box pot-box-total" style="margin-bottom:.75rem">
      <div class="pot-box-label">Total Pot</div>
      <div class="pot-box-val">${fmtMoney(totalPot)}</div>
    </div>
    <div class="pot-boxes-grid" style="margin-bottom:1.5rem">${boxes}</div>
  `;

  return potPanel + buildHistTable();
}

function buildHistTable() {
  const hist = HISTORY_FALLBACK;
  const teamKeys = Object.keys(hist);
  if (!teamKeys.length) return `<div class="status-bar" style="color:var(--text2)">Historical data not loaded yet.</div>`;

  const cols = [
    { key:"name",        label:"Team",               fmt: (t,h) => "", special:"team" },
    { key:"moneyPL",     label:"All-time Money +/-",  fmt: (t,h) => `<span style="color:${h.moneyPL>=0?"var(--good)":"var(--danger)"};font-weight:500">${h.moneyPL>=0?"+ $":"- $"}${Math.abs(h.moneyPL).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`, cls: ()=>"" },
    { key:"wins",        label:"W",                   fmt: (t,h) => h.wins||0 },
    { key:"losses",      label:"L",                   fmt: (t,h) => h.losses||0 },
    { key:"winPct",      label:"Win %",               fmt: (t,h) => ((h.winPct||0)*100).toFixed(1)+"%" },
    { key:"avgFinish",   label:"Avg Finish",          fmt: (t,h) => h.avgFinish||"—" },
    { key:"avgPts",      label:"Avg Season Pts",      fmt: (t,h) => (h.avgPts||0).toLocaleString("en-US",{maximumFractionDigits:1}) },
    { key:"playoffApps", label:"Playoff Apps",        fmt: (t,h) => h.playoffApps||0 },
    { key:"champs",      label:"🏆",                  fmt: (t,h) => h.champs>0?h.champs+"★":"—", cls: (t,h)=>h.champs>0?"champ-star":"" },
  ];

  // Build rows from HISTORY_FALLBACK merged with TEAM_META
  const rows = teamKeys.map(name => ({ name, ...hist[name] }));

  // Sort
  rows.sort((a,b) => {
    let av = a[histSortCol], bv = b[histSortCol];
    if (typeof av === "string") return histSortDir==="asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    return histSortDir==="asc" ? av-bv : bv-av;
  });

  const headers = cols.map(c => {
    const isSorted = histSortCol === c.key;
    const cls = isSorted ? (histSortDir==="desc"?"sorted-desc":"sorted-asc") : "";
    return `<th class="${cls}" onclick="sortHist(\'${c.key}\')">${c.label}</th>`;
  }).join("");

  const bodyRows = rows.map(r => {
    const meta = TEAM_META[r.name] || {};
    const cells = cols.map(c => {
      if (c.special === "team") {
        return `<td><div class="hist-team-cell">
          ${teamLogo(r.name, 24)}
          <span>${r.name}</span>
        </div></td>`;
      }
      const val = c.fmt(r, r);
      const cls = c.cls ? c.cls(r, r) : "";
      return `<td class="${cls}">${val}</td>`;
    }).join("");
    return `<tr>${cells}</tr>`;
  }).join("");

  return `
    <div style="font-size:14px;font-weight:500;color:var(--text);margin-bottom:.75rem">League History <span style="font-size:12px;font-weight:400;color:var(--text3)">— click any column header to sort</span></div>
    <div class="hist-table-wrap">
      <table class="hist-table">
        <thead><tr>${headers}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
}

function sortHist(col) {
  if (histSortCol === col) {
    histSortDir = histSortDir === "desc" ? "asc" : "desc";
  } else {
    histSortCol = col;
    histSortDir = col === "name" || col === "avgFinish" ? "asc" : "desc";
  }
  // Re-render just the home content
  const teams  = _teams;
  const payouts = _payouts || [];
  document.getElementById("home-content").innerHTML = buildLeagueHome(teams, payouts);
}

// ─────────────────────────────────────────────
//  Parse Player Salary tab → upcoming free agents
//  Columns: Player, Salary, Team, Contract, Position
//  FA contracts: 1, Arb3, Arb4, Ext 6
//  TO contracts: 2-TO (asterisk — team option)
// ─────────────────────────────────────────────
const FA_CONTRACTS = new Set(["1","arb3","arb4","ext 6","ext6"]);
const TO_CONTRACTS = new Set(["2-to"]);
const POS_ORDER_FA = ["C","1B","2B","3B","SS","OF","SP","RP"];

const TEAM_COLORS_FA = {
  "Kansas City Royals":"#174185","Seattle Mariners":"#005C5C",
  "Los Angeles Dodgers":"#005A9C","Los Angeles Angels":"#BA0021",
  "Texas Rangers":"#003278","Milwaukee Brewers":"#12284B",
  "Las Vegas A\'s":"#003831","Chicago Cubs":"#0E3386",
  "San Diego Padres":"#2F241D","Baltimore Orioles":"#DF4601",
  "San Francisco Giants":"#FD5A1E","Cincinnati Reds":"#C6011F",
};

function parsePlayerSalary(rows) {
  const fa = [];
  // Skip header row (row 0)
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0] || !r[0].trim()) continue;
    const name     = r[0].trim();
    const salary   = parseMoney(r[1]);
    const team     = r[2] ? r[2].trim() : "";
    const contract = r[3] ? r[3].trim() : "";
    const position = r[4] ? r[4].trim() : "";
    const cLower   = contract.toLowerCase();
    const isFA     = FA_CONTRACTS.has(cLower);
    const isTO     = TO_CONTRACTS.has(cLower);

    if (!isFA && !isTO) continue;

    // Expand multi-position players — add one entry per position
    const positions = position.split(",").map(p => p.trim()).filter(Boolean);
    if (positions.length === 0) positions.push("?");

    for (const pos of positions) {
      fa.push({ name, salary, team, contract, position: pos, primaryPos: pos, to: isTO });
    }
  }
  // Sort by position order then name
  fa.sort((a,b) => {
    const pa = POS_ORDER_FA.indexOf(a.primaryPos);
    const pb = POS_ORDER_FA.indexOf(b.primaryPos);
    const posA = pa === -1 ? 99 : pa;
    const posB = pb === -1 ? 99 : pb;
    if (posA !== posB) return posA - posB;
    return a.name.localeCompare(b.name);
  });
  return fa;
}

function buildFASection() {
  const FA_DATA = UPCOMING_FA_LIVE.length > 0 ? UPCOMING_FA_LIVE : UPCOMING_FA;
  const positions = ["ALL",...POS_ORDER_FA];
  const filterBtns = positions.map(p => {
    const col = POS_COLORS[p] || { bg:"#888", text:"#fff" };
    return `<button class="fa-filter-btn ${p==="ALL"?"active":""}" onclick="filterFA(\'${p}\')" id="fa-btn-${p}"
      data-bg="${col.bg}" data-text="${col.text}"
      style="${p==="ALL"?"background:"+col.bg+";color:"+col.text+";border-color:"+col.bg+"":""}"
    >${p==="ALL"?"All Positions":p}</button>`;
  }).join("");
  const confirmed = FA_DATA.filter(p=>!p.to).length;
  const pending   = FA_DATA.filter(p=>p.to).length;
  return `
    <div class="fa-wrap">
      <div class="fa-header">
        <h2>🔓 Upcoming Free Agents</h2>
        <span class="fa-meta">${confirmed} confirmed · ${pending} pending team option decision</span>
        <button class="section-toggle-btn" id="fa-toggle-btn" onclick="toggleFASection()">▶ Show</button>
      </div>
      <div class="section-collapsible collapsed" id="fa-collapsible">
        <div class="fa-filters">${filterBtns}</div>
        <div class="fa-table-wrap" id="fa-table-wrap">${renderFATable("ALL", FA_DATA)}</div>
        <p class="fa-footnote">* Player has a 2-year team option — will only reach free agency if the team declines their option</p>
      </div>
    </div>
  `;
}

function renderFATable(posFilter, faData) {
  const data = faData || (UPCOMING_FA_LIVE.length > 0 ? UPCOMING_FA_LIVE : UPCOMING_FA);
  let filtered = data.filter(p => {
    const posMatch = posFilter === "ALL" || (p.primaryPos || p.pos) === posFilter;
    const teamMatch = faCurrentTeam === "ALL" || (p.team || p.owner) === faCurrentTeam;
    return posMatch && teamMatch;
  });
  if (!filtered.length) return `<div style="padding:1.5rem;text-align:center;color:var(--text3);font-size:13px">No upcoming free agents at this position</div>`;

  // Dedupe multi-pos players in ALL view, then sort per user preference
  if (posFilter === "ALL") {
    const seen = new Set();
    const deduped = [];
    const bySalary = [...filtered].sort((a,b) => b.salary - a.salary);
    for (const p of bySalary) {
      if (!seen.has(p.name)) { seen.add(p.name); deduped.push(p); }
    }
    filtered = deduped;
    if (faCurrentSort === "lastname") {
      filtered.sort((a,b) => {
        const lastA = a.name.trim().split(" ").pop();
        const lastB = b.name.trim().split(" ").pop();
        return lastA.localeCompare(lastB);
      });
    }
    // else already sorted by salary desc
  } else {
    // Position tab — sort by user preference
    if (faCurrentSort === "salary") {
      filtered.sort((a,b) => b.salary - a.salary);
    } else {
      filtered.sort((a,b) => {
        const lastA = a.name.trim().split(" ").pop();
        const lastB = b.name.trim().split(" ").pop();
        return lastA.localeCompare(lastB);
      });
    }
  }

  const posColor = POS_COLORS[posFilter] || { bg:"#888", text:"#fff" };
  const headerAccent = posFilter !== "ALL" ? `style="background:${posColor.bg}22;color:${posColor.bg}"` : "";

  let html = `<table class="fa-table"><thead><tr>
    <th>Player</th>
    <th ${posFilter !== "ALL" ? headerAccent : ""}>Pos</th>
    <th>Current Salary</th>
  </tr></thead><tbody>`;

  for (const p of filtered) {
    const ppos = p.primaryPos || p.pos || "?";
    const posCol = POS_COLORS[ppos] || { bg:"#888", text:"#fff" };
    const salary = p.salary > 0 ? "$" + (p.salary / 1e6).toFixed(2) + "M" : "—";
    const toLabel = p.to ? ` * <em class="fa-to-note">Team Option</em>` : "";
    html += `<tr>
      <td>${p.name}${toLabel}</td>
      <td><span class="fa-pos-badge" style="background:${posCol.bg}22;color:${posCol.bg};font-weight:600">${ppos}</span></td>
      <td>${salary}</td>
    </tr>`;
  }
  html += "</tbody></table>";
  return html;
}

function toggleFASection() {
  const el  = document.getElementById("fa-collapsible");
  const btn = document.getElementById("fa-toggle-btn");
  const isCollapsed = el.classList.contains("collapsed");
  el.classList.toggle("collapsed", !isCollapsed);
  btn.textContent = isCollapsed ? "▼ Hide" : "▶ Show";
}

function filterFA(pos) {
  faCurrentPos = pos;
  document.querySelectorAll(".fa-filter-btn").forEach(b => {
    b.classList.remove("active");
    b.style.background = "";
    b.style.color = "";
    b.style.borderColor = "";
  });
  const btn = document.getElementById("fa-btn-"+pos);
  if (btn) {
    btn.classList.add("active");
    const bg   = btn.getAttribute("data-bg") || "#1F3864";
    const text = btn.getAttribute("data-text") || "#fff";
    btn.style.background   = bg;
    btn.style.color        = text;
    btn.style.borderColor  = bg;
  }
  const FA_DATA = UPCOMING_FA_LIVE.length > 0 ? UPCOMING_FA_LIVE : UPCOMING_FA;
  document.getElementById("fa-table-wrap").innerHTML = renderFATable(pos, FA_DATA);
}

let RULES_DATA     = { proposed: [], history: [] };
let FORM_RESP_DATA = [];

function parseRulesChanges(rows) {
  const proposed = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0] && !r[1]) continue;
    proposed.push({
      category:    r[0] ? r[0].trim() : "",
      proposal:    r[1] ? r[1].trim() : "",
      currentRule: r[2] ? r[2].trim() : "",
      proposed:    r[3] ? r[3].trim() : "",
      proposedBy:  r[4] ? r[4].trim() : "",
      rationale:   r[5] ? r[5].trim() : "",
      status:      r[6] ? r[6].trim() : "Proposed",
      votesFor:    r[7] ? parseInt(r[7]) || 0 : 0,
      votesAgainst:r[8] ? parseInt(r[8]) || 0 : 0,
      result:      r[9] ? r[9].trim() : "",
    });
  }
  return proposed;
}

function parseFormResponses(rows) {
  // Each column (after Timestamp and Email) is a proposal question
  // Each row is one owner's vote — Timestamp in col 0, Email in last col
  if (rows.length < 2) return [];
  const headers = rows[0];

  // First pass: group rows by year from Timestamp column
  // Timestamp format: "11/2/2025 20:41:56" or "2025-11-02 20:41:56"
  function extractYear(ts) {
    if (!ts) return "Unknown";
    // Try MM/DD/YYYY format
    const mdy = ts.match(/\d{1,2}\/\d{1,2}\/(\d{4})/);
    if (mdy) return mdy[1];
    // Try YYYY-MM-DD format
    const ymd = ts.match(/^(\d{4})-/);
    if (ymd) return ymd[1];
    // Try any 4-digit year
    const yr = ts.match(/\b(20\d{2})\b/);
    if (yr) return yr[1];
    return "Unknown";
  }

  // Build a map of year -> row indices
  const yearRows = {};
  for (let row = 1; row < rows.length; row++) {
    const ts = rows[row][0] || "";
    const year = extractYear(ts);
    if (!yearRows[year]) yearRows[year] = [];
    yearRows[year].push(row);
  }

  // For each year, tally votes per proposal column
  const proposals = [];
  const years = Object.keys(yearRows).sort();

  for (const year of years) {
    const rowIdxs = yearRows[year];
    // Headers 1 through end, skipping Timestamp (col 0) and Email (last col)
    // Detect email column by header name
    const emailColIdx = headers.findIndex(h => h.toLowerCase().includes("email"));
    const lastPropCol = emailColIdx > -1 ? emailColIdx : headers.length;
    for (let col = 1; col < lastPropCol; col++) {
      const question = headers[col].trim();
      if (!question) continue;
      const colonIdx = question.indexOf(":");
      const category = colonIdx > -1 ? question.substring(0, colonIdx).trim() : "Other";
      const proposal = colonIdx > -1 ? question.substring(colonIdx + 1).trim() : question;

      let votesFor = 0, votesAgainst = 0;
      for (const rowIdx of rowIdxs) {
        const vote = rows[rowIdx][col] ? rows[rowIdx][col].trim() : "";
        if (vote.toLowerCase().startsWith("yes")) votesFor++;
        else if (vote.toLowerCase().startsWith("no")) votesAgainst++;
      }
      const total = votesFor + votesAgainst;
      const passed = votesFor >= 8;
      proposals.push({
        category, proposal, votesFor, votesAgainst, total,
        passed, status: passed ? "Passed" : "Failed", year,
      });
    }
  }
  return proposals;
}

function catClass(cat) {
  const c = cat.toLowerCase();
  if (c.includes("trad")) return "cat-trading";
  if (c.includes("scor")) return "cat-scoring";
  if (c.includes("roster")) return "cat-roster";
  if (c.includes("fine")) return "cat-fines";
  if (c.includes("fee")) return "cat-fees";
  if (c.includes("draft")) return "cat-draft";
  if (c.includes("free") || c.includes("agency")) return "cat-free-agency";
  if (c.includes("schedul") || c.includes("season")) return "cat-schedule";
  return "cat-other";
}

function statusClass(s) {
  const sl = (s || "").toLowerCase();
  if (sl.includes("pass")) return "passed";
  if (sl.includes("fail")) return "failed";
  if (sl.includes("pend")) return "pending";
  return "proposed";
}

let finSortCol = 'capHit';
let finSortDir = 'desc';

function buildFinancialsHome() {
  const teamArr = Object.values(_teams);
  const CAP = 250000000;
  const fmtM = v => "$"+(v/1e6).toFixed(2)+"M";
  const fmtD = v => "$"+Math.abs(v).toFixed(2);

  const cols = [
    { key:"name",     label:"Team",            align:"left"  },
    { key:"capSpace", label:"Cap Space",        align:"right" },
    { key:"capHit",   label:"Total Cap Hit",    align:"right" },
    { key:"payroll",  label:"Active Payroll",   align:"right" },
    { key:"tax",      label:"Payroll Tax",      align:"right" },
    { key:"dead",     label:"Dead Money",       align:"right" },
    { key:"milb",     label:"MiLB Pool",        align:"right" },
    { key:"netDues",  label:"Net Dues",         align:"right" },
  ];

  function getVal(t, key) {
    const capHit = t.payrollReal+t.deadReal;
    return { name:t.name, capSpace:CAP-capHit, capHit, payroll:t.payrollReal,
      tax:t.taxReal, dead:t.deadReal, milb:t.mlBonusReal, netDues:t.finalDues }[key];
  }

  const sorted = [...teamArr].sort((a,b) => {
    const av = getVal(a, finSortCol), bv = getVal(b, finSortCol);
    if (typeof av==="string") return finSortDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return finSortDir==="asc"?av-bv:bv-av;
  });

  const headers = cols.map(c => {
    const isSorted = finSortCol===c.key;
    const cls = isSorted?(finSortDir==="desc"?"sorted-desc":"sorted-asc"):"";
    const align = c.align==="left"?"text-align:left":"";
    return `<th class="${cls}" style="${align}" onclick="sortFinTable(\'${c.key}\')">${c.label}</th>`;
  }).join("");

  const rows = sorted.map(t => {
    const capHit = t.payrollReal+t.deadReal;
    const capPct = Math.min(104,Math.round(capHit/CAP*100));
    const capColor = capPct>100?"var(--danger)":capPct>96?"var(--warn)":"var(--good)";
    const dueColor = t.finalDues>=0?"var(--good)":"var(--danger)";
    const taxColor = t.taxDues>240?"var(--warn)":"var(--text)";
    const space = CAP - capHit;
    const spaceColor = space < 0 ? "var(--danger)" : space < 10000000 ? "var(--warn)" : "var(--good)";
    return `<tr onclick="showTeamFinancials(\'${t.name.replace(/'/g,"\\'")}\');showSection(\'financials\')" style="cursor:pointer">
      <td><div class="fin-team-cell">
        <img src="${LOGO_BASE}${(TEAM_META[t.name]||{}).logo||""}" width="28" height="28" style="border-radius:14px;object-fit:contain;background:#fff;flex-shrink:0">
        <span style="font-weight:500">${t.name}</span>
      </div></td>
      <td style="color:${spaceColor};font-weight:500">${space>=0?fmtM(space):"-"+fmtM(Math.abs(space))}</td>
      <td style="color:${capColor};font-weight:500">${fmtM(capHit)}</td>
      <td>${fmtM(t.payrollReal)}</td>
      <td style="color:${taxColor}">${fmtM(t.taxReal)}</td>
      <td style="color:${t.deadReal>0?"var(--warn)":"var(--text)"}">${t.deadReal>0?fmtM(t.deadReal):"—"}</td>
      <td>${fmtM(t.mlBonusReal)}</td>
      <td style="color:${dueColor};font-weight:500">${t.finalDues>=0?"+ ":"- "}${fmtD(t.finalDues)}</td>
    </tr>`;
  }).join("");

  return `
    <p style="font-size:12px;color:var(--text3);margin-bottom:.75rem">Click any row to view full team detail · Click column headers to sort</p>
    <div class="fin-table-wrap">
      <table class="fin-table">
        <thead><tr>${headers}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}


function sortFinTable(col) {
  finSortDir = finSortCol===col?(finSortDir==="desc"?"asc":"desc"):(col==="name"?"asc":"desc");
  finSortCol = col;
  document.getElementById("financials-content").innerHTML = buildFinancialsHome();
}

function buildTeamFinancialDetail(teamName) {
  const t = Object.values(_teams).find(t => t.name === teamName);
  if (!t) return `<div class="status-bar">Team not found.</div>`;
  const meta  = TEAM_META[t.name] || {};
  const CAP   = 250000000;
  const total = t.payrollReal + t.deadReal;
  const space = CAP - total;
  const pct   = Math.min(104, Math.round(total/CAP*100));
  const fmtM  = v => "$"+(v/1e6).toFixed(2)+"M";
  const fmtD  = v => "$"+Math.abs(v).toFixed(2);
  const barColor = pct>100?"#A32D2D":pct>96?"#BA7517":"#3B6D11";
  const spaceStr = space>=0 ? fmtM(space)+" available" : fmtM(Math.abs(space))+" over cap";
  const spaceClass = space>=0 ? "var(--good)" : "var(--danger)";
  const dueColor = t.finalDues>=0 ? "var(--good)" : "var(--danger)";
  const h = HISTORY_FALLBACK[t.name] || {};

  // Reuse the existing expandTeam detail panel HTML
  return `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:1.25rem">
      ${teamLogo(t.name, 52)}
      <div>
        <div style="font-size:16px;font-weight:500;color:var(--text)">${t.name}</div>
        <div style="font-size:12px;color:var(--text2)">${meta.owner||""} · ${meta.phone||""}</div>
      </div>
    </div>

    ${h.moneyPL !== undefined ? `
    <div class="sec-header">League history</div>
    <div class="hist-grid" style="margin-bottom:1rem">
      <div class="pm"><div class="pm-lbl">All-time money +/-</div><div class="pm-val" style="color:${h.moneyPL>=0?"var(--good)":"var(--danger)"}">${h.moneyPL>=0?"+ $":"- $"}${Math.abs(h.moneyPL).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>
      <div class="pm"><div class="pm-lbl">Win %</div><div class="pm-val">${((h.winPct||0)*100).toFixed(1)}%</div><div class="pm-sub">${h.wins||0}W – ${h.losses||0}L</div></div>
      <div class="pm"><div class="pm-lbl">Avg finish</div><div class="pm-val">${h.avgFinish||"—"}</div><div class="pm-sub">out of 12</div></div>
      <div class="pm"><div class="pm-lbl">Avg season pts</div><div class="pm-val">${(h.avgPts||0).toLocaleString("en-US",{maximumFractionDigits:1})}</div></div>
      <div class="pm"><div class="pm-lbl">Playoff appearances</div><div class="pm-val">${h.playoffApps||0}</div></div>
      <div class="pm"><div class="pm-lbl">Championships</div><div class="pm-val" style="color:${(h.champs||0)>0?"var(--warn)":"var(--text)"}">${(h.champs||0)===0?"—":h.champs+" 🏆"}</div></div>
    </div>` : ""}

    <div class="sec-header">2026 Expenses</div>
    <div class="p-grid" style="margin-bottom:1rem">
      <div class="pm"><div class="pm-lbl">Active payroll</div><div class="pm-val">${fmtM(t.payrollReal)}</div><div class="pm-sub">$${t.payrollDues.toFixed(2)} in dues</div></div>
      <div class="pm"><div class="pm-lbl">Dead money</div><div class="pm-val ${t.deadReal>0?"warn":"good"}">${t.deadReal===0?"None":fmtM(t.deadReal)}</div><div class="pm-sub">${t.deadDues===0?"$0.00":"$"+t.deadDues.toFixed(2)} in dues</div></div>
      <div class="pm"><div class="pm-lbl">Total cap hit</div><div class="pm-val">${fmtM(total)}</div><div class="pm-sub" style="color:${spaceClass}">${spaceStr}</div></div>
      <div class="pm"><div class="pm-lbl">Payroll tax</div><div class="pm-val ${t.taxDues>240?"warn":""}">${fmtM(t.taxReal)}</div><div class="pm-sub">$${t.taxDues.toFixed(2)} in dues</div></div>
      <div class="pm"><div class="pm-lbl">MiLB bonus pool</div><div class="pm-val">${fmtM(t.mlBonusReal)}</div><div class="pm-sub">$${t.mlBonusDues.toFixed(2)} in dues</div></div>
      <div class="pm"><div class="pm-lbl">Trade $ spent</div><div class="pm-val">${t.tradeSpentReal===0?"None":fmtM(t.tradeSpentReal)}</div><div class="pm-sub">$${t.tradeSpentDues.toFixed(2)} in dues</div></div>
    </div>
    <div class="pm" style="margin-bottom:.75rem"><div class="pm-lbl">Total expenses</div><div class="pm-val" style="color:var(--danger)">$${t.totalExpDues.toFixed(2)} in dues</div></div>

    <hr class="divider">
    <div class="sec-header">2026 Earnings</div>
    <div class="p-grid" style="margin-bottom:1rem">
      <div class="pm"><div class="pm-lbl">Trade $ saved</div><div class="pm-val good">${t.tradeSavedReal===0?"None":fmtM(t.tradeSavedReal)}</div><div class="pm-sub">${t.tradeSavedDues===0?"$0.00":"$"+t.tradeSavedDues.toFixed(2)} earned back</div></div>

    <div class="pm"><div class="pm-lbl">Net dues owed (until end of season)</div><div class="pm-val" style="font-size:26px;color:${dueColor}">${t.finalDues>=0?"+ ":"- "}${fmtD(t.finalDues)}</div></div>

    <hr class="divider">
    <div class="sec-header">2027 Outlook</div>
    <div class="p-grid" style="margin-bottom:1rem">
      <div class="pm"><div class="pm-lbl">Guaranteed payroll</div><div class="pm-val">${fmtM(t.guaranteed2027)}</div></div>
      <div class="pm"><div class="pm-lbl">Expiring contracts</div><div class="pm-val warn">${fmtM(t.expiring)}</div></div>
      <div class="pm"><div class="pm-lbl">Non-guaranteed</div><div class="pm-val">${fmtM(t.nonGuaranteed)}</div></div>
      <div class="pm"><div class="pm-lbl">Future dead money</div><div class="pm-val ${t.futDead>0?"warn":"good"}">${t.futDead===0?"None":fmtM(t.futDead)}</div></div>
      <div class="pm"><div class="pm-lbl">Cap space</div><div class="pm-val" style="color:${spaceClass}">${spaceStr}</div></div>
    </div>
    <div class="pbar-lbl" style="margin-top:.5rem"><span>Cap used: ${fmtM(total)} of $250M</span><span>${pct}%</span></div>

const SECTIONS = ["home","financials","roster","fa","rules","cba"];
let currentSection = "home";
let rosterMenuOpen = false;

function showSection(name) {
  currentSection = name;
  // Hide all sections
  SECTIONS.forEach(s => {
    const el = document.getElementById("section-" + s);
    if (el) el.classList.toggle("hidden", s !== name);
  });
  // Update nav active state
  document.querySelectorAll(".nav-item:not(.sub-item)").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById("nav-" + name);
  if (btn) btn.classList.add("active");

  // Collapse submenus that don't belong to this section
  if (name !== "financials") {
    financialsMenuOpen = false;
    const fs = document.getElementById("financials-submenu");
    const fa = document.getElementById("financials-arrow");
    if (fs) fs.classList.remove("open");
    if (fa) fa.classList.remove("open");
    document.querySelectorAll(".fin-sub-item").forEach(b => b.classList.remove("active"));
  }
  if (name !== "roster") {
    rosterMenuOpen = false;
    const rs = document.getElementById("roster-submenu");
    const ra = document.getElementById("roster-arrow");
    if (rs) rs.classList.remove("open");
    if (ra) ra.classList.remove("open");
    document.querySelectorAll(".nav-item.sub-item:not(.fin-sub-item)").forEach(b => b.classList.remove("active"));
  }

  // Close mobile menu when navigating
  closeMobileMenu();
  // Scroll to top
  window.scrollTo(0, 0);
}

function toggleMobileMenu() {
  const sidebar  = document.getElementById("sidebar");
  const overlay  = document.getElementById("sidebar-overlay");
  const isOpen   = sidebar.classList.contains("mobile-open");
  sidebar.classList.toggle("mobile-open", !isOpen);
  overlay.classList.toggle("visible", !isOpen);
}

function closeMobileMenu() {
  document.getElementById("sidebar").classList.remove("mobile-open");
  document.getElementById("sidebar-overlay").classList.remove("visible");
}

function toggleRosterMenu() {
  rosterMenuOpen = !rosterMenuOpen;
  const submenu = document.getElementById("roster-submenu");
  const arrow   = document.getElementById("roster-arrow");
  submenu.classList.toggle("open", rosterMenuOpen);
  arrow.classList.toggle("open", rosterMenuOpen);
  document.getElementById("nav-roster").classList.toggle("active", rosterMenuOpen);
  // On mobile: just open the menu, don't navigate to blank roster page
  // On desktop: navigate to roster section so submenu is visible alongside content
  const isMobile = window.innerWidth <= 700;
  if (rosterMenuOpen && !isMobile) showSection("roster");
  // Show a prompt on the roster section if no team is selected yet

const CAT_ORDER = ["Trading","Free Agency","Roster","Draft","Scoring","Season Schedule","Fees","Fines","Other"];

function sortByCategory(items) {
  return [...items].sort((a,b) => {
    const ai = CAT_ORDER.findIndex(c => a.category.toLowerCase().includes(c.toLowerCase()));
    const bi = CAT_ORDER.findIndex(c => b.category.toLowerCase().includes(c.toLowerCase()));
    const aIdx = ai === -1 ? 99 : ai;
    const bIdx = bi === -1 ? 99 : bi;
    if (aIdx !== bIdx) return aIdx - bIdx;
    return a.proposal.localeCompare(b.proposal);
  });
}

function buildRulesSectionInner() {
  const proposed = RULES_DATA.proposed;
  const history  = FORM_RESP_DATA;
  let html = "";

  // ── Pending Proposals (always open) ──
  if (proposed.length > 0) {
    html += `<div class="rules-year-group">
      <div class="rules-year-label">🔵 Pending Proposals</div>`;
    for (const r of sortByCategory(proposed)) {
      const total = (r.votesFor||0)+(r.votesAgainst||0);
      const pct   = total > 0 ? Math.round(r.votesFor/total*100) : 0;
      html += `<div class="rules-card">
        <div class="rules-card-top">
          <span class="rules-category ${catClass(r.category)}">${r.category}</span>
          <span class="rules-proposal">${r.proposal}</span>
          <span class="rules-status ${statusClass(r.status)}">${r.status||"Proposed"}</span>
        </div>
        ${r.rationale?`<div class="rules-rationale">${r.rationale}</div>`:""}
        ${r.proposedBy?`<div class="rules-proposed-by">Proposed by: ${r.proposedBy}</div>`:""}
        ${total>0?`<div class="rules-votes"><span class="rules-vote-for">✓ ${r.votesFor} for</span><span class="rules-vote-against">✗ ${r.votesAgainst} against</span></div><div class="rules-vote-bar"><div class="rules-vote-fill" style="width:${pct}%"></div></div>`:""}
      </div>`;
    }
    html += `</div>`;
  }

  // ── Historical results grouped by year, each year collapsed by default ──
  // Within each year, group by category with accordion
  if (history.length > 0) {
    const years = [...new Set(history.map(r=>r.year))].filter(y=>y!=="Unknown").sort((a,b)=>b.localeCompare(a));
    years.forEach((year, yi) => {
      const yearItems = history.filter(r=>r.year===year);
      const passed = yearItems.filter(r=>r.passed).length;
      const failed = yearItems.filter(r=>!r.passed).length;

      // Group by category
      const cats = [...new Set(sortByCategory(yearItems).map(r=>r.category))];
      const catAccordions = cats.map((cat, ci) => {
        const catItems = sortByCategory(yearItems.filter(r=>r.category===cat));
        const catPassed = catItems.filter(r=>r.passed).length;
        const bodyId = `rules-cat-${yi}-${ci}`;
        const rows = catItems.map(r => {
          const pct = r.total>0?Math.round(r.votesFor/r.total*100):0;
          const barColor = r.passed?"var(--good)":"var(--danger)";
          return `<div class="rules-card" style="margin-left:1rem;margin-bottom:6px">
            <div class="rules-card-top">
              <span class="rules-proposal">${r.proposal}</span>
              <span class="rules-status ${r.passed?"passed":"failed"}">${r.passed?"✓ Passed":"✗ Failed"}</span>
            </div>
            <div class="rules-votes">
              <span class="rules-vote-for">✓ ${r.votesFor} for</span>
              <span class="rules-vote-against">✗ ${r.votesAgainst} against</span>
              <span style="color:var(--text3);font-size:11px">(needed 8/12)</span>
            </div>
            <div class="rules-vote-bar"><div class="rules-vote-fill" style="width:${pct}%;background:${barColor}"></div></div>
          </div>`;
        }).join("");

        return `<div style="margin-bottom:4px">
          <button class="cba-trigger" onclick="toggleEl(\'${bodyId}\')" style="padding:6px 12px;font-size:12px">
            <span class="rules-category ${catClass(cat)}" style="margin-right:6px">${cat}</span>
            <span style="color:var(--text2);font-size:11px">${catPassed}/${catItems.length} passed</span>
            <span class="cba-arrow" id="${bodyId}-arrow" style="margin-left:auto">▶</span>
          </button>
          <div id="${bodyId}" style="display:none;padding:6px 0">${rows}</div>
        </div>`;
      }).join("");

      const sectionId = `rules-year-${yi}`;
      html += `<div class="rules-year-group">
        <button class="cba-trigger" onclick="toggleEl(\'${sectionId}\')" style="width:100%;padding:10px 12px;font-size:13px;font-weight:500">
          <span>📅 ${year} Winter Meetings</span>
          <span style="font-size:11px;font-weight:400;color:var(--text2);margin-left:8px">${passed} passed · ${failed} failed</span>
          <span class="cba-arrow" id="${sectionId}-arrow" style="margin-left:auto">▶</span>
        </button>
        <div id="${sectionId}" style="display:none;padding:8px 0">${catAccordions}</div>
      </div>`;
    });
  }

  if (!proposed.length && !history.length) {
    html = `<div class="status-bar" style="color:var(--text2)">No rules changes data available yet.</div>`;
  }
  return html;
}
